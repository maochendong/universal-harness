name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify
        id: verify
        continue-on-error: true
        run: pnpm verify
      - name: Write same-commit platform Evidence
        if: always()
        run: >-
          node scripts/write-ci-platform-evidence.mjs
          --platform ${{ matrix.os }}
          --exit-status ${{ steps.verify.outcome == 'success' && 0 || 1 }}
          --output .reports/ci-platform/${{ matrix.os }}.json
      - name: Upload platform Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-platform-${{ matrix.os }}
          path: .reports/ci-platform/${{ matrix.os }}.json
          if-no-files-found: error
      - name: Fail the platform job when verify failed
        if: steps.verify.outcome != 'success'
        run: node -e "process.exit(1)"

  performance:
    # The design's hard thresholds are defined for ubuntu-latest; the gate
    # runs in isolation so wall-clock measurements stay meaningful.
    name: Performance release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cross-package imports resolve through package exports to dist/, so a
      # clean checkout must build before the vitest gates run.
      - run: pnpm build
      - run: pnpm test:security
      - run: pnpm test:fault
      - run: pnpm test:performance

  release:
    # M1 release exit gate (plan Task 28): packaged CLI smoke plus the
    # acceptance report, which fails unless all 28 criteria hold evidence.
    name: Release gate
    runs-on: ubuntu-latest
    needs: [verify, performance]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download all platform Evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-platform-*
          path: .reports/ci-platform
          merge-multiple: true
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:smoke
      - run: pnpm test:release
